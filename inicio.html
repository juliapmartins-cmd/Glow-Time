<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Time - Início</title>
 
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
    <!-- Google Fonts (Playfair Display para títulos sofisticados) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
 
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/inicio.css">
</head>
<body class="d-flex flex-column min-vh-100">
 
    <!-- ================= CABEÇALHO / NAVBAR ================= -->
<header class="header-topo sticky-top">
 
    <div class="container-fluid px-3 px-md-4 h-100 d-flex align-items-center justify-content-between position-relative">
 
        <!-- ESQUERDA -->
        <nav class="nav-links d-flex gap-3 gap-md-4">
            <a href="#" class="link-nav active">Início</a>
            <a href="#" class="link-nav">Profissionais</a>
            <a href="#" class="link-nav">Sobre</a>
        </nav>
 
        <!-- LOGO CENTRAL -->
        <a href="#" class="logo-centro">
            <img src="imagem/imagem.png"
                alt="Logo Glow Time"
                class="logo-header">
        </a>
 
        <!-- DIREITA -->
        <div class="header-icons d-flex align-items-center gap-3 gap-md-4">
            <a href="#" class="text-white text-decoration-none" title="Sacola de Compras">
                <i class="bi bi-bag-check fs-4"></i>
            </a>
 
            <a href="#" class="chatbot-btn text-white text-decoration-none text-center" title="ChatBot">
                <i class="bi bi-robot fs-4 d-block lh-1"></i>
                <span class="small-text">ChatBot</span>
            </a>
        </div>
 
    </div>
 
</header>
 
    <!-- ================= BANNER PRINCIPAL (HERO) ================= -->
    <section class="hero-banner position-relative">
        <img src="imagem/salun.png" alt="Salão de Beleza" class="hero-img">
        <div class="hero-overlay d-flex align-items-center justify-content-center text-center p-3">
            <h1 class="hero-title text-white m-0">
                Sua beleza começa<br>
                <span class="fw-normal">quando você decide se cuidar</span>
            </h1>
        </div>
    </section>
 
    <!-- ================= CARDS DE CATEGORIAS / SERVIÇOS ================= -->
    <main class="container-fluid px-3 px-md-5 py-5 flex-grow-1 d-flex align-items-center">
        <div class="w-100">
            <!-- Grid de 5 colunas no Desktop (lg) -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-3 g-md-4 justify-content-center">
 
                <!-- CARD 1: CABELO -->
                <div class="col">
                    <a href="#" class="card-categoria d-block text-decoration-none">
                        <img src="imagem/cabeloss.png" alt="Cabelo" class="card-img">
                        <div class="card-overlay">
                            <h2 class="card-titulo">Cabelo</h2>
                        </div>
                    </a>
                </div>
 
                <!-- CARD 2: ESTÉTICA -->
                <div class="col">
                    <a href="#" class="card-categoria d-block text-decoration-none">
                        <img src="imagem/estetica.png" alt="Estética" class="card-img">
                        <div class="card-overlay">
                            <h2 class="card-titulo">Estética</h2>
                        </div>
                    </a>
                </div>
 
                <!-- CARD 3: MAQUIAGEM -->
                <div class="col">
                    <a href="#" class="card-categoria d-block text-decoration-none">
                        <img src="imagem/maquiagem.png" alt="Maquiagem" class="card-img">
                        <div class="card-overlay">
                            <h2 class="card-titulo">Maquiagem</h2>
                        </div>
                    </a>
                </div>
 
                <!-- CARD 4: UNHAS -->
                <div class="col">
                    <a href="#" class="card-categoria d-block text-decoration-none">
                        <img src="imagem/unha.png" alt="Unhas" class="card-img">
                        <div class="card-overlay">
                            <h2 class="card-titulo">Unhas</h2>
                        </div>
                    </a>
                </div>
 
                <!-- CARD 5: MASSAGEM -->
                <div class="col">
                    <a href="#" class="card-categoria d-block text-decoration-none">
                        <img src="imagem/massage,.png" alt="Massagem" class="card-img">
                        <div class="card-overlay">
                            <h2 class="card-titulo">Massagem</h2>
                        </div>
                    </a>
                </div>
 
            </div>
        </div>
    </main>
 
    <!-- ================= RODAPÉ ================= -->
    <footer class="rodape py-3 mt-auto">
        <div class="container-fluid px-4">
            <div class="row align-items-center text-center text-md-start gy-2">
                <div class="col-md-4">
                    <span class="rodape-label">Redes Sociais:</span>
                    <a href="#" class="rodape-link ms-1">Instagram</a>
                </div>
                <div class="col-md-4 text-md-center">
                    <span class="rodape-label">Contato:</span>
                    <a href="tel:11948179090" class="rodape-link ms-1">(11) 94817-9090</a>
                </div>
                <div class="col-md-4 text-md-end">
                    <span class="rodape-label">Email:</span>
                    <a href="mailto:glow.time@gmail.com" class="rodape-link ms-1">glow.time@gmail.com</a>
                </div>
            </div>
        </div>
    </footer>
 
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
