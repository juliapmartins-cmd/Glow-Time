<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Glow Time</title>
 
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
    <!-- Fonte Poppins e Playfair -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="css/novasenha.css">
</head>
 
<body>
 
    <!-- BARRA SUPERIOR -->
    <header class="barra">
        <div class="lado-esquerdo">
            <a href="#" class="voltar">
                <i class="bi bi-chevron-left"></i>
            </a>
            
            <img src="imagem/imagem.png" alt="Logo Glow Time" class="logo">
 
            <span class="titulo-barra">Glow time</span>
        </div>
    </header>
 
    <!-- ÁREA CENTRALIZADA -->
    <main class="area-conteudo">
        
        <!-- CARD DA RECUPERAÇÃO DE SENHA -->
        <div class="card-login">
            
            <h1 class="titulo-card">Qual será sua nova senha?</h1>
 
            <form>
                <!-- CAMPO 1: E-MAIL OU TELEFONE -->
                <div class="campo-grupo">
                   
                     <label for="senha" class="form-label">Informe sua nova senha:</label>
                    <input type="password" id="senha" class="form-control" placeholder="Senha nova">
                </div>
 
                <div class="campo-grupo">
                   
                     <label for="senha" class="form-label">Repita sua senha:</label>
                    <input type="password" id="senha" class="form-control" placeholder="Senha nova">
                    <button type="button" class="btn btn-azul">Confirmar</button>
                </div>
 
            </form>
 
        </div>
 
    </main>
 
</body>
 
</html>
