<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Time - Agendamento Confirmado</title>
 
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
 
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/agendamentoconf.css">
</head>
 
<body>
 
    <!-- Header / Barra Superior -->
    <header class="header-barra">
        <div class="container-fluid d-flex align-items-center justify-content-between h-100 px-4">
 
            <nav class="nav-links d-flex gap-3">
                <a href="#">Início</a>
            </nav>
 
            <div class="logo-container text-center">
                <img src="imagem/imagem.png" alt="Logo Glow Time" class="logo-img">
            </div>
 
            <div class="header-icons d-flex align-items-center gap-3">
                <!-- Espaço mantido para alinhamento central da logo -->
            </div>
 
        </div>
    </header>
 
    <!-- Conteúdo Principal -->
    <main class="container container-principal my-5">
 
        <!-- Stepper (Passos do Processo) -->
        <div class="stepper-wrapper mb-5">
            <div class="stepper-line"></div>
            <div class="stepper-item completed">
                <div class="step-counter"><i class="bi bi-bag-check"></i></div>
            </div>
            <div class="stepper-item completed">
                <div class="step-counter"><i class="bi bi-calendar-event"></i></div>
            </div>
            <div class="stepper-item completed">
                <div class="step-counter"><i class="bi bi-calendar-check"></i></div>
            </div>
            <div class="stepper-item active">
                <div class="step-counter"><i class="bi bi-currency-dollar"></i></div>
            </div>
        </div>
 
        <!-- Box Principal de Confirmação -->
        <div class="box-confirmacao-outer mx-auto">
            
            <!-- Banner / Título Interno -->
            <div class="banner-titulo text-center mb-4">
                <h1 class="titulo-confirmacao mb-0">Agendamento Confirmado!</h1>
            </div>
 
            <!-- Card Interno com Mensagem e Ícone -->
            <div class="card-confirmacao-inner text-center p-4 p-md-5">
                <h2 class="subtitulo-sucesso mb-3">Pagamento realizado com sucesso!</h2>
                <p class="desc-sucesso mb-4">Te aguardamos para seu dia de beleza!</p>
 
                <div class="icone-check-wrapper mx-auto mt-4">
                    <i class="bi bi-check-lg"></i>
                </div>
            </div>
 
        </div>
 
        <!-- Alerta de Segurança -->
        <div class="ambiente-seguro text-center mt-4 d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-shield-check"></i>
            <span>Ambiente seguro. Seus dados estão protegidos</span>
        </div>
 
    </main>
 
    <!-- Rodapé -->
    <footer class="footer-barra py-4 mt-5">
        <div class="container">
            <div class="row text-center text-md-start g-3">
                <div class="col-md-4">
                    <p class="footer-label mb-1">Redes Sociais:</p>
                    <a href="#" class="footer-link">Instagram</a>
                </div>
                <div class="col-md-4 text-md-center">
                    <p class="footer-label mb-1">Contato:</p>
                    <p class="footer-info mb-0">(11) 94617-9099</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <p class="footer-label mb-1">Email:</p>
                    <p class="footer-info mb-0">glowtime@gmail.com</p>
                </div>
            </div>
        </div>
    </footer>
 
</body>
 
</html>
