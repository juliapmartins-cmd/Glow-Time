<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GlowTime</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/cadastro.css">
    <!-- Importando a fonte Nunito do Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Barra superior -->
    <header class="custom-header d-flex align-items-center px-4">
        <div class="d-flex align-items-center gap-3">
            <a href="login.html" class="back-arrow">&lt;</a>
            <div class="header-logo">
                <img src="imagem/imagem.png" alt="Logo" class="logo-img">
            </div>
        </div>
        <h1 class="header-title m-0 mx-auto">Glow time</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="container cadastro-container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <!-- QUADRADO/CAIXA DE FUNDO -->
                <div class="cadastro-box">
                    
                    <!-- Título Cadastro -->
                    <h2 class="text-center fw-bold cadastro-title mb-4">Cadastro</h2>

                    <!-- Formulário -->
                    <form>
                        <!-- Nome -->
                        <div class="mb-3">
                            <label class="form-label custom-label">Nome</label>
                            <input type="text" class="form-control custom-input" placeholder="Digite seu e-mail">
                        </div>

                        <!-- Telefone -->
                        <div class="mb-3">
                            <label class="form-label custom-label">Telefone</label>
                            <input type="text" class="form-control custom-input" placeholder="Digite seu e-mail">
                        </div>

                        <!-- E-mail -->
                        <div class="mb-3">
                            <label class="form-label custom-label">E-mail</label>
                            <input type="email" class="form-control custom-input" placeholder="Digite seu e-mail">
                        </div>

                        <!-- CPF -->
                        <div class="mb-4">
                            <label class="form-label custom-label">CPF</label>
                            <input type="text" class="form-control custom-input" placeholder="Digite seu cpf">
                        </div>

                        <!-- Botão Entrar -->
                        <div class="d-grid">
                            <button class="btn btn-submit" type="button" >Entrar</button>
                              <a href="pg_inicial.html" class="back-arrow">&lt;</a>
                        </div>
                    </form>

                </div> <!-- FIM DO QUADRADO DE FUNDO -->

            </div>
        </div>
    </div>

</body>
</html>
