<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GlowTime</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Importando a fonte Nunito do Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Barra superior -->
    <header class="custom-header d-flex align-items-center px-4">
        <div class="header-logo">
            <img src="imagem/imagem.png" alt="Logo" class="logo-img">
        </div>
        <h1 class="header-title m-0 mx-auto">Glow time</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <!-- QUADRADO/CAIXA DE FUNDO DO LOGIN -->
                <div class="login-box">

                    <!-- Título Login -->
                    <h2 class="text-center fw-bold login-title mb-4">Login</h2>

                    <!-- Login social -->
                    <div class="d-flex flex-column align-items-center gap-2 mb-4">

                        <!-- Apple -->
                        <button class="btn btn-social btn-apple">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                                <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43"/>
                                <path d="M14.496 11.741c-.048-.096-2.325-1.234-2.113-3.422.212-2.188 1.675-2.789 1.698-2.854-.597-.79-1.254-1.157-1.563-1.434-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56.244.73.625 1.924 1.273 2.796.576.984 1.34 1.667 1.659 1.899.319.232 1.219.386 1.843.067.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758.52-1.185.473-1.282.419-1.378"/>
                            </svg>
                            <span>Entrar com Apple</span>
                        </button>

                        <!-- Google -->
                        <button class="btn btn-social btn-google">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                                <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
                            </svg>
                            <span> Entrar com Google</span>
                        </button>

                        <!-- Facebook -->
                        <button class="btn btn-social btn-facebook">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                                <path d="M16 8.049C16 3.603 12.418 0 8 0S0 3.603 0 8.049c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16C13.074 15.396 16 12.066 16 8.049"/>
                            </svg>
                            <span>Entrar com Facebook</span>
                        </button>

                    </div>

                    <!-- Formulário de Email e Senha -->
                    <form>
                        <div class="mb-3">
                            <label class="form-label custom-label">Email</label>
                            <input type="email" class="form-control custom-input" placeholder="Digite seu e-mail">
                        </div>

                        <div class="mb-1">
                            <label class="form-label custom-label">Senha</label>
                            <input type="password" class="form-control custom-input" placeholder="Digite sua senha">
                        </div>

                        <!-- Esqueceu a senha -->
                        <div class="text-end mb-4">
                            <a href="#" class="forgot-password-link">Esqueceu a senha?</a>
                        </div>

                        <!-- Botão Entrar -->
                        <div class="d-grid mb-3">
                            <button class="btn btn-submit" type="button">Entrar</button>
                        </div>

                        <!-- Cadastrar-se -->
                        <div class="text-center">
                            <a href="cadastro.html" class="register-link">Cadastrar-se</a>
                        </div>
                    </form>

                </div> <!-- FIM DO QUADRADO DE FUNDO -->

            </div>
        </div>
    </div>

</body>
</html>
