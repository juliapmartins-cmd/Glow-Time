<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Time - Minha Sacola</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/sacola.css">
</head>

<body>

    <!-- Header / Barra Superior -->
    <header class="header-barra">
        <div class="container-fluid d-flex align-items-center justify-content-center h-100">
            <a href="#" class="logo-link">
                <img src="imagem/imagem.png" alt="Logo Glow Time" class="logo-img">
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content d-flex flex-column align-items-center justify-content-center py-5">
        
        <!-- Indicador de Etapas / Progress Bar -->
        <div class="etapas-container d-flex align-items-center justify-content-between mb-5">
            <div class="etapa-linha"></div>
            
            <div class="etapa-item ativa">
                <i class="bi bi-bag-check-fill"></i>
            </div>
            <div class="etapa-item">
                <i class="bi bi-calendar3"></i>
            </div>
            <div class="etapa-item">
                <i class="bi bi-calendar-check"></i>
            </div>
            <div class="etapa-item">
                <i class="bi bi-coin"></i>
            </div>
        </div>

        <!-- Card da Sacola -->
        <div class="card-sacola w-100 mb-5">
            <div class="card-sacola-header text-center">
                <h2>Minha Sacola (4)</h2>
            </div>
            <ul class="lista-itens">
                <li class="item-sacola d-flex align-items-center justify-content-between">
                    <span>Limpeza de pele</span>
                    <button class="btn-remover" title="Remover item">
                        <i class="bi bi-trash"></i>
                    </button>
                </li>
                <li class="item-sacola d-flex align-items-center justify-content-between">
                    <span>Lash lifting</span>
                    <button class="btn-remover" title="Remover item">
                        <i class="bi bi-trash"></i>
                    </button>
                </li>
                <li class="item-sacola d-flex align-items-center justify-content-between">
                    <span>Blindagem</span>
                    <button class="btn-remover" title="Remover item">
                        <i class="bi bi-trash"></i>
                    </button>
                </li>
                <li class="item-sacola d-flex align-items-center justify-content-between">
                    <span>Massagem Modeladora</span>
                    <button class="btn-remover" title="Remover item">
                        <i class="bi bi-trash"></i>
                    </button>
                </li>
            </ul>
        </div>

        <!-- Botões de Ação -->
        <div class="botoes-container d-flex justify-content-between gap-4 w-100">
            <a href="#" class="btn btn-navegacao flex-grow-1 text-center">VOLTAR</a>
            <a href="#" class="btn btn-navegacao flex-grow-1 text-center">IR PARA AGENDAMENTO</a>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="footer-barra py-4">
        <div class="container">
            <div class="row text-center text-md-start g-3">
                <div class="col-md-4">
                    <p class="footer-label mb-1">Redes Sociais:</p>
                    <a href="#" class="footer-link">Instagram</a>
                </div>
                <div class="col-md-4 text-md-center">
                    <p class="footer-label mb-1">Contato:</p>
                    <p class="footer-info mb-0">(11) 94817-9090</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <p class="footer-label mb-1">Email:</p>
                    <p class="footer-info mb-0">glow.time@gmail.com</p>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
