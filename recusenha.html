<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Glow Time</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts (Poppins para o formulário e Sancreek para a Logo) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Sancreek&display=swap" rel="stylesheet">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/recusenha.css">
</head>

<body>

    <header>
        <div class="container-fluid barra">
            <div class="d-flex align-items-center h-100">
                <a href="index.html" class="voltar">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <img src="imagem/imagem.png" alt="Logo Glow Time" class="logo">
                <span class="brand-title">Glow time</span>
            </div>
        </div>
    </header>

    <section class="conteudo-principal">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7 col-12">
                    
                    <!-- Quadrado / Card Central -->
                    <div class="card-recuperar">
                        
                        <h1 class="titulo-pagina">Recuperar senha</h1>

                        <form class="form-recuperar">
                            <!-- Etapa 1: E-mail ou Telefone -->
                            <div class="campo mb-3">
                                <label for="emailTelefone" class="form-label">E-mail ou Telefone</label>
                                <input type="text" id="emailTelefone" class="form-control custom-input" placeholder="Digite seu e-mail ou telefone">
                            </div>

                            <button type="button" class="btn btn-primary btn-acao w-100 mb-4">Confirmar</button>

                            <!-- Etapa 2: Código de Validação -->
                            <div class="campo mb-3">
                                <label for="codigo" class="form-label">Código</label>
                                <input type="text" id="codigo" class="form-control custom-input" placeholder="Digite o código">
                            </div>

                            <button type="submit" class="btn btn-primary btn-acao w-100">Enviar</button>
                        </form>

                    </div>

                </div>
            </div>
        </div>
    </section>

</body>
</html>
